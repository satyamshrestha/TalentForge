services:

  nginx:
    image: nginx:1.27-alpine

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      api:
        condition: service_healthy


  api:
    image: satyamshrestha/talentforge:latest

    restart: unless-stopped

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}

      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}

      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ORIGINS: ${CORS_ORIGINS}

      UPLOAD_DIR: ${UPLOAD_DIR}

      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES}

    volumes:
      - resume_uploads:/app/uploads/resumes

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3


  celery_worker:
    image: satyamshrestha/talentforge:latest

    restart: unless-stopped

    command: celery -A tasks.celery_app.celery worker --loglevel=info

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}

      UPLOAD_DIR: ${UPLOAD_DIR}

      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES}

    volumes:
      - resume_uploads:/app/uploads/resumes


  db:
    image: postgres:17

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:8.2-alpine

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.5.0

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    depends_on:
      api:
        condition: service_healthy
  
  grafana:
    image: grafana/grafana:12.1.1

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      prometheus:
        condition: service_started

volumes:
  postgres_data:
  resume_uploads:
  prometheus_data:
  grafana_data: